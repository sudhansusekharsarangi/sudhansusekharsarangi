<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07162f"/>
      <stop offset="75%" stop-color="#101f3c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity=".18"/>
    </linearGradient>

    <!-- =========================
         NAME GRADIENT
    ========================== -->

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="38%" stop-color="#c4b5fd"/>
      <stop offset="68%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- =========================
         CLOUD GRADIENTS
    ========================== -->

    <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334b72"/>
      <stop offset="45%" stop-color="#1e3357"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>

    <linearGradient id="cloudLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b86b5"/>
      <stop offset="50%" stop-color="#30476d"/>
      <stop offset="100%" stop-color="#101f3a"/>
    </linearGradient>

    <!-- =========================
         MOON
    ========================== -->

    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="25%" stop-color="#bfdbfe" stop-opacity=".45"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================
         WATER
    ========================== -->

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132f52"/>
      <stop offset="35%" stop-color="#0a203b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- =========================
         GLOW FILTERS
    ========================== -->

    <filter id="moonBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- =========================
         SCENE CLIP
    ========================== -->

    <clipPath id="scene">
      <rect width="1200" height="500" rx="18"/>
    </clipPath>

  </defs>


  <!-- =====================================================
       SCENE
  ====================================================== -->

  <g clip-path="url(#scene)">

    <!-- SKY -->
    <rect width="1200" height="500" fill="url(#sky)"/>

    <!-- Horizon atmosphere -->
    <rect y="285" width="1200" height="110" fill="url(#horizonGlow)"/>


    <!-- =================================================
         STARS
    ================================================== -->

    <g fill="#dbeafe">

      <circle cx="55" cy="55" r="1.2"/>
      <circle cx="105" cy="95" r="1"/>
      <circle cx="165" cy="42" r="1.4"/>
      <circle cx="225" cy="75" r=".9"/>
      <circle cx="290" cy="35" r="1.2"/>
      <circle cx="350" cy="92" r="1"/>
      <circle cx="420" cy="52" r="1.4"/>
      <circle cx="490" cy="28" r=".9"/>
      <circle cx="545" cy="73" r="1.2"/>
      <circle cx="620" cy="44" r="1"/>
      <circle cx="680" cy="88" r="1.4"/>
      <circle cx="750" cy="32" r="1"/>
      <circle cx="815" cy="67" r="1.2"/>
      <circle cx="875" cy="40" r=".9"/>
      <circle cx="930" cy="75" r="1.3"/>
      <circle cx="1000" cy="38" r="1"/>
      <circle cx="1060" cy="82" r="1.4"/>
      <circle cx="1130" cy="50" r="1"/>
      <circle cx="1170" cy="105" r="1.2"/>

    </g>


    <!-- =================================================
         MOON
    ================================================== -->

    <circle
      cx="950"
      cy="108"
      r="125"
      fill="url(#moonGlow)"
      filter="url(#moonBlur)"
    />

    <circle
      cx="950"
      cy="108"
      r="42"
      fill="#e0f2fe"
    />

    <!-- Moon surface -->
    <circle cx="934" cy="94" r="7" fill="#b8c7d9" opacity=".38"/>
    <circle cx="968" cy="84" r="5" fill="#b8c7d9" opacity=".3"/>
    <circle cx="975" cy="119" r="8" fill="#b8c7d9" opacity=".32"/>
    <circle cx="939" cy="125" r="5" fill="#b8c7d9" opacity=".25"/>


    <!-- =================================================
         DISTANT CLOUD LAYER
         SLOW DREAMY MOVEMENT
    ================================================== -->

    <g opacity=".52">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -70 3; -140 0; -70 -2; 0 0"
        dur="34s"
        repeatCount="indefinite"
      />

      <path
        d="
          M-100 155
          C20 100 100 120 175 150
          C245 80 360 105 400 155
          C470 110 570 115 625 160
          C700 110 805 115 875 160
          C950 105 1080 115 1170 160
          C1240 120 1290 125 1350 160
          L1350 230
          L-100 230 Z
        "
        fill="url(#cloudDark)"
      />

    </g>


    <!-- =================================================
         MAIN CLOUD GROUP
         CLEAR HORIZONTAL MOVEMENT
    ================================================== -->

    <g>

      <!-- Movement is intentionally slow but large enough
           to be clearly visible -->

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          -260 0;
          -80 -4;
          100 0;
          280 4;
          100 0;
          -80 -4;
          -260 0
        "
        dur="28s"
        repeatCount="indefinite"
      />

      <!-- Main cloud body -->

      <g fill="url(#cloudDark)">

        <ellipse cx="80" cy="145" rx="150" ry="48"/>
        <ellipse cx="180" cy="125" rx="145" ry="60"/>
        <ellipse cx="300" cy="150" rx="175" ry="55"/>
        <ellipse cx="425" cy="125" rx="145" ry="62"/>
        <ellipse cx="555" cy="150" rx="180" ry="55"/>

      </g>

    </g>


    <!-- =================================================
         SECOND CLOUD GROUP
         OPPOSITE DIRECTION
    ================================================== -->

    <g>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          250 12;
          120 6;
          0 0;
          -120 -5;
          0 0;
          120 6;
          250 12
        "
        dur="38s"
        repeatCount="indefinite"
      />

      <g fill="url(#cloudLight)" opacity=".7">

        <ellipse cx="760" cy="155" rx="150" ry="48"/>
        <ellipse cx="870" cy="130" rx="135" ry="62"/>
        <ellipse cx="990" cy="155" rx="170" ry="55"/>
        <ellipse cx="1120" cy="125" rx="150" ry="65"/>
        <ellipse cx="1240" cy="155" rx="160" ry="48"/>

      </g>

    </g>


    <!-- =================================================
         SOFT CLOUD HIGHLIGHTS
         MOVING WITH CLOUDS
    ================================================== -->

    <g opacity=".18">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="100 0; 0 2; -100 0; 0 -2; 100 0"
        dur="25s"
        repeatCount="indefinite"
      />

      <ellipse
        cx="850"
        cy="145"
        rx="210"
        ry="40"
        fill="#bfdbfe"
        filter="url(#softGlow)"
      />

    </g>


    <!-- =================================================
         MOUNTAINS
    ================================================== -->

    <path
      d="
        M0 330
        L95 265
        L175 315
        L285 235
        L385 315
        L510 245
        L620 325
        L735 250
        L850 315
        L970 225
        L1080 315
        L1170 250
        L1250 320
        L1250 390
        L0 390 Z
      "
      fill="#071426"
    />

    <!-- Mountain highlights -->

    <path
      d="
        M0 330
        L95 265
        L175 315
        L285 235
        L385 315
        L510 245
        L620 325
        L735 250
        L850 315
        L970 225
        L1080 315
        L1170 250
        L1250 320
      "
      fill="none"
      stroke="#334b72"
      stroke-opacity=".3"
    />


    <!-- =================================================
         LAKE
    ================================================== -->

    <rect
      y="315"
      width="1200"
      height="185"
      fill="url(#water)"
    />


    <!-- =================================================
         MOON REFLECTION
    ================================================== -->

    <g stroke="#bfdbfe" fill="none" opacity=".18">

      <ellipse cx="950" cy="375" rx="70" ry="3">
        <animate
          attributeName="rx"
          values="70;110;70"
          dur="5s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          values=".18;.04;.18"
          dur="5s"
          repeatCount="indefinite"
        />
      </ellipse>

      <ellipse cx="950" cy="390" rx="105" ry="4">
        <animate
          attributeName="rx"
          values="105;155;105"
          dur="6s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          values=".15;.02;.15"
          dur="6s"
          repeatCount="indefinite"
        />
      </ellipse>

      <ellipse cx="950" cy="405" rx="135" ry="5">
        <animate
          attributeName="rx"
          values="135;185;135"
          dur="7s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          values=".12;.02;.12"
          dur="7s"
          repeatCount="indefinite"
        />
      </ellipse>

    </g>


    <!-- =================================================
         WATER HORIZONTAL RIPPLE LINES
    ================================================== -->

    <g
      stroke="#60a5fa"
      stroke-width="1"
      opacity=".16"
      fill="none"
    >

      <path d="M80 355 Q180 350 280 355">
        <animate
          attributeName="d"
          values="
            M80 355 Q180 350 280 355;
            M60 355 Q180 362 300 355;
            M80 355 Q180 350 280 355
          "
          dur="7s"
          repeatCount="indefinite"
        />
      </path>

      <path d="M390 375 Q500 368 610 375">
        <animate
          attributeName="d"
          values="
            M390 375 Q500 368 610 375;
            M370 375 Q500 382 630 375;
            M390 375 Q500 368 610 375
          "
          dur="8s"
          repeatCount="indefinite"
        />
      </path>

      <path d="M700 350 Q800 345 900 350">
        <animate
          attributeName="d"
          values="
            M700 350 Q800 345 900 350;
            M680 350 Q800 357 920 350;
            M700 350 Q800 345 900 350
          "
          dur="6s"
          repeatCount="indefinite"
        />
      </path>

      <path d="M980 430 Q1090 423 1200 430">
        <animate
          attributeName="d"
          values="
            M980 430 Q1090 423 1200 430;
            M960 430 Q1090 438 1220 430;
            M980 430 Q1090 423 1200 430
          "
          dur="9s"
          repeatCount="indefinite"
        />
      </path>

    </g>


    <!-- =================================================
         LEFT SILHOUETTE
    ================================================== -->

    <path
      d="
        M0 280
        C45 250 70 225 90 205
        C105 190 115 205 110 225
        C145 190 170 210 155 245
        C185 215 200 240 180 270
        L205 330
        L0 350 Z
      "
      fill="#020617"
      opacity=".95"
    />


    <!-- =================================================
         MAIN NAME
    ================================================== -->

    <text
      x="600"
      y="235"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="55"
      font-weight="500"
      letter-spacing="1"
      fill="url(#nameGradient)"
    >
      Sudhansu Sekhar Sarangi
    </text>


    <!-- =================================================
         NAME SOFT GLOW
    ================================================== -->

    <text
      x="600"
      y="235"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="55"
      font-weight="500"
      letter-spacing="1"
      fill="none"
      stroke="#c084fc"
      stroke-width="1"
      opacity=".18"
      filter="url(#softGlow)"
    >
      Sudhansu Sekhar Sarangi
    </text>


    <!-- =================================================
         SUBTITLE
    ================================================== -->

    <text
      x="600"
      y="275"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18"
      letter-spacing="5"
      fill="#e2e8f0"
    >
      Sophomore CSE Student
    </text>


    <!-- =================================================
         DIVIDER
    ================================================== -->

    <line
      x1="390"
      y1="292"
      x2="810"
      y2="292"
      stroke="#93c5fd"
      stroke-opacity=".3"
    />

    <circle
      cx="390"
      cy="292"
      r="3"
      fill="#93c5fd"
    />

    <circle
      cx="810"
      cy="292"
      r="3"
      fill="#f0abfc"
    />


    <!-- =================================================
         MAIN FOCUS
    ================================================== -->

    <text
      x="600"
      y="325"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      letter-spacing="3"
      fill="#cbd5e1"
    >
      Computer Science
      <tspan fill="#a78bfa"> • </tspan>
      Intelligence
      <tspan fill="#a78bfa"> • </tspan>
      Systems
    </text>


<!-- =================================================
     SKILL TAGS
================================================= -->

<g transform="translate(15, 0)">

<!-- Java -->
<rect
  x="330"
  y="345"
  width="90"
  height="32"
  rx="16"
  fill="#071426"
  stroke="#38bdf8"
  stroke-opacity=".6"
/>

<text
  x="375"
  y="366"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="14"
  fill="#e0f2fe"
>
  Java
</text>


<!-- Python -->
<rect
  x="435"
  y="345"
  width="100"
  height="32"
  rx="16"
  fill="#071426"
  stroke="#60a5fa"
  stroke-opacity=".6"
/>

<text
  x="485"
  y="366"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="14"
  fill="#e0f2fe"
>
  Python
</text>


<!-- DSA -->
<rect
  x="550"
  y="345"
  width="80"
  height="32"
  rx="16"
  fill="#071426"
  stroke="#a78bfa"
  stroke-opacity=".7"
/>

<text
  x="590"
  y="366"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="14"
  fill="#ede9fe"
>
  DSA
</text>


<!-- AI/ML -->
<rect
  x="645"
  y="345"
  width="90"
  height="32"
  rx="16"
  fill="#071426"
  stroke="#f0abfc"
  stroke-opacity=".65"
/>

<text
  x="690"
  y="366"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="14"
  fill="#fdf4ff"
>
  AI / ML
</text>


<!-- Web Dev -->
<rect
  x="750"
  y="345"
  width="90"
  height="32"
  rx="16"
  fill="#071426"
  stroke="#fdba74"
  stroke-opacity=".6"
/>

<text
  x="795"
  y="366"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="14"
  fill="#fff7ed"
>
  Web Dev
</text>

</g>


    <!-- =================================================
         SUBTLE FOREGROUND GLOW
    ================================================== -->

    <ellipse
      cx="600"
      cy="420"
      rx="400"
      ry="50"
      fill="#2563eb"
      opacity=".04"
      filter="url(#moonBlur)"
    />

  </g>

</svg>